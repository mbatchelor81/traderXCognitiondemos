# Generated as part of the TraderX Kubernetes base. Tenant overlays patch
# tenant-specific values (namespace, TENANT_ID, config).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: people-service
  labels:
    app: people-service
    app.kubernetes.io/name: people-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: traderx
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: people-service
  template:
    metadata:
      labels:
        app: people-service
        app.kubernetes.io/name: people-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: traderx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: people-service
          image: traderx-people-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          env:
            - name: TENANT_ID
              value: "PLACEHOLDER"
            - name: PORT
              value: "8005"
          envFrom:
            - configMapRef:
                name: people-service-config
            - secretRef:
                name: people-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
