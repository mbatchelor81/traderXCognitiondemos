apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: people-service
  labels:
    app: people-service
    app.kubernetes.io/name: people-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: traderx
spec:
