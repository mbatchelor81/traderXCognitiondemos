worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format json escape=json
        '{"timestamp":"$time_iso8601","service":"gateway","method":"$request_method",'
        '"path":"$uri","status":$status,"upstream":"$upstream_addr",'
        '"duration_ms":$request_time,"correlation_id":"$http_x_correlation_id"}';
    access_log /dev/stdout json;

    upstream account-service        { server account-service:8001; }
    upstream trading-service        { server trading-service:8002; }
    upstream position-service       { server position-service:8003; }
    upstream reference-data-service { server reference-data-service:8004; }
    upstream people-service         { server people-service:8005; }
    upstream web-frontend           { server web-frontend:8080; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Domain routes, keyed on the prefixes the services actually register.
        # nginx picks the longest matching prefix, so /accountuser and /trades
        # resolve correctly despite overlapping with /account and /trade.
        location /account          { proxy_pass http://account-service; }
        location /accountuser      { proxy_pass http://account-service; }
        location /trade            { proxy_pass http://trading-service; }
        location /trades           { proxy_pass http://trading-service; }
        location /analytics        { proxy_pass http://trading-service; }
        location /positions        { proxy_pass http://position-service; }
        location /stocks           { proxy_pass http://reference-data-service; }
        location /people           { proxy_pass http://people-service; }

        # Per-service health and metrics. A bare /health is ambiguous behind a
        # single hostname, so every service also answers on /svc/<slug>/*.
        location /svc/account        { proxy_pass http://account-service; }
        location /svc/trading        { proxy_pass http://trading-service; }
        location /svc/position       { proxy_pass http://position-service; }
        location /svc/reference-data { proxy_pass http://reference-data-service; }
        location /svc/people         { proxy_pass http://people-service; }

        location /socket.io {
            proxy_pass http://trading-service;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # Catch-all: the React single-page app.
        location / { proxy_pass http://web-frontend; }
    }
}
